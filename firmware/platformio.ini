; LED Display Controller firmware
; Waveshare ESP32-S3-RGB-Matrix (ESP32-S3-N32R16: Flash 32MB / PSRAM 16MB Octal)

[env:esp32-s3-rgb-matrix]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; Octal flash / PSRAM. Without these the board bootloops.
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_build.flash_mode = opi
board_build.psram_type = opi
board_build.arduino.memory_type = opi_opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
    fastled/FastLED@3.10.3
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/AnimatedGIF@^2.2.0
    h2zero/NimBLE-Arduino@^1.4.3
